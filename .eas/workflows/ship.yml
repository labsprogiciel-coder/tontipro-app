# On every push to main: if an installed preview build can run this code
# (same native fingerprint), ship it over the air on the "preview" channel;
# otherwise make a new internal preview build. Android only: the agents' TPEs
# are Android devices.
name: Ship preview

on:
  push:
    branches: [main]

jobs:
  fingerprint:
    type: fingerprint
    environment: preview # must match the preview build profile's environment

  android_get_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      platform: android
      profile: preview

  android_update:
    needs: [android_get_build]
    if: ${{ needs.android_get_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      channel: preview
      platform: android

  android_build:
    needs: [android_get_build]
    if: ${{ !needs.android_get_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview
